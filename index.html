<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170b2f">
  <meta name="description" content="CapyCatch - поймай как можно больше мандаринов за 60 секунд!">
  <title>CapyCatch 2.0 by Bekk3r</title>
  <link rel="preload" href="capy.png" as="image">
  <link rel="preload" href="mandarin.png" as="image">
  <link rel="preload" href="gold.png" as="image">
  <link rel="preload" href="bomb.png" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-labelledby="page-title">
    <header class="game-header">
      <div>
        <p class="eyebrow">мини-игра от Bekk3r</p>
        <h1 id="page-title">CapyCatch <span>2.0</span></h1>
      </div>

      <div class="toolbar" aria-label="Настройки игры">
        <button id="sound-button" class="icon-button" type="button" aria-label="Выключить звук" title="Звук (M)">🔊</button>
        <button id="pause-button" class="text-button" type="button" aria-label="Поставить игру на паузу" disabled>Пауза</button>
      </div>
    </header>

    <section class="game-frame" aria-label="Игровое поле">
      <canvas id="game" width="500" height="450" tabindex="0" aria-label="Игра CapyCatch. Управляйте капибарой и ловите мандарины.">
        Ваш браузер не поддерживает Canvas.
      </canvas>
    </section>

    <div class="mobile-controls" aria-label="Управление капибарой">
      <button id="left-button" class="move-button" type="button" aria-label="Двигаться влево">◀</button>
      <button id="right-button" class="move-button" type="button" aria-label="Двигаться вправо">▶</button>
    </div>

    <p class="controls-hint">
      <span>Клавиатура: ← → или A D</span>
      <span>Телефон: кнопки или веди пальцем</span>
    </p>

    <p id="live-status" class="sr-only" role="status" aria-live="polite">Загрузка игры</p>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
